<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Áreas</title>
    <style>
        .container{
            border: 2px dotted blue;
            display: grid;
            grid-template: repeat(5,  100px) / repeat(6, 100px);
        }
        .item1{
            border: 2px dotted black;
            background-color: red;
            grid-area: 1/1/span 1/span 4;
        }

        .item2{
            border: 2px dotted black;
            background-color: green;
            grid-area: 2/1/span 4/span 2;
        }

        .item3{
            border: 2px dotted black;
            background-color: yellow;
            grid-area: 2/3/span 3/span 2;
        }

        .item4{
            border: 2px dotted black;
            background-color: orange;
            grid-area: 1/5/span 5/span 2;
        }
        .item5{
            border: 2px dotted black;
            background-color: purple;
            grid-area: 5/1/span 1/span 4;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="item1">Caixa-1</div>
        <div class="item2">Caixa-2</div>
        <div class="item3">Caixa-3</div>
        <div class="item4">Caixa-4</div>
        <div class="item5">Caixa-5</div>
    </main>
</body>
</html>
