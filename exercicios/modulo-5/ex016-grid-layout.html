<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Áreas</title>
    <style>
        .container{
            border: 2px dotted blue;
            display: grid;
            grid-template: repeat(3,  100px) / repeat(4, 100px);
        }
        .item1{
            border: 2px dotted black;
            background-color: red;
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 5;
        }

        .item2{
            border: 2px dotted black;
            background-color: green;
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 3;
        }

        .item3{
            border: 2px dotted black;
            background-color: yellow;
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="item1">Caixa-1</div>
        <div class="item2">Caixa-2</div>
        <div class="item3">Caixa-3</div>
    </main>
</body>
</html>
